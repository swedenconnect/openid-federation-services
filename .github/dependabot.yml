version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      spring-upgrade:
        applies-to: version-updates
        patterns:
          - org.springframework.boot:*
      swedenconnect-upgrade:
        applies-to: version-updates
        patterns:
          - se.swedenconnect.security:*
    ignore:
      - dependency-name: org.apache.santuario:xmlsec
